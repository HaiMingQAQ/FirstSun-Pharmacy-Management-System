# FirstSun Pharmacy Management System - 开发数据库
# 用法：docker compose up -d   （首次会自动执行 sql/*.sql 初始化建表）
# 停止：docker compose down     （保留数据）
# 重置：docker compose down -v && docker compose up -d   （删除数据并重新初始化）

services:
  mysql:
    image: mysql:8.0
    container_name: firstsun-pharmacy-mysql
    restart: unless-stopped
    environment:
      # 以下值从同目录 .env 读取；没有 .env 时用 ${VAR:-默认值} 的默认值
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-firstsun_pharmacy}
      MYSQL_USER: ${MYSQL_USER:-pharmacy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pharmacy123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 左边是宿主机端口（映射 .env 里的 MYSQL_PORT），右边 3306 是容器内固定端口
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      # 数据卷：容器删除后数据仍在
      - mysql-data:/var/lib/mysql
      # 初始化脚本：仅首次启动（数据卷为空时）按文件名顺序执行一次
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:

