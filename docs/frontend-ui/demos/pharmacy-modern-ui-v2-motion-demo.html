 store:{name:'门店管理',en:'STORE NETWORK',symbol:'店',add:'新增门店',total:'5',metrics:[['营业中','4',''],['医保门店','3',''],['证照预警','1','90天内']],cols:['门店','地址','电话','营业时间','医保','状态','操作'],rows:[['FirstSun 中心店','测试市中心路 1 号','138****1001','08:00-22:00','是','营业'],['FirstSun 城北店','测试市城北路 18 号','138****1002','08:30-21:30','是','营业'],['FirstSun 学府店','测试市学府路 66 号','138****1003','09:00-22:00','否','营业'],['FirstSun 湖滨店','测试市湖滨路 9 号','138****1004','08:00-21:00','是','营业'],['FirstSun 测试停业店','测试市旧街 5 号','138****1005','09:00-18:00','否','停业']]},

};let active='drug',selected=0;
const icons={
 drug:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h5M8 16h4"/></svg>',
 category:'<svg viewBox="0 0 24 24"><path d="M4 6h6l2 2h8v11H4V6Z"/><path d="M8 12h8M8 15h5"/></svg>',
 barcode:'<svg viewBox="0 0 24 24"><path d="M4 5v14M7 5v14M10 5v14M14 5v14M16 5v14M20 5v14"/></svg>',
 store:'<svg viewBox="0 0 24 24"><path d="M4 10v10h16V10M3 10l2-6h14l2 6"/><path d="M3 10a3 3 0 0 0 5 2 3 3 0 0 0 5 0 3 3 0 0 0 5 0 3 3 0 0 0 3-2M9 20v-5h6v5"/></svg>',
 employee:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>'
};
const $=id=>document.getElementById(id),nav=$('moduleNav'),body=$('body'),head=$('head'),inspector=$('inspector');
function tagClass(v){return ['启用','营业','在职','已通过','是'].includes(v)?'ok':['待审核','休假'].includes(v)?'warn':['离职','停业','否'].includes(v)?'off':'info'}
function renderNav(){nav.innerHTML=Object.entries(data).map(([k,v])=>`<button class="nav-item ${k===active?'active':''}" data-k="${k}"><span class="nav-symbol">${icons[k]}</span><span>${v.name}</span><span class="nav-count">${v.total}</span></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.k;selected=0;render()})}
function renderInspector(row){if(!row){inspector.innerHTML='<div class="empty-select">选择一条记录查看详情</div>';return}inspector.innerHTML=`<div class="entity-mark">${data[active].symbol}</div><div class="entity-name">${row[0]}</div><div class="entity-code">${active.toUpperCase()} · ${row[1]}</div><div class="detail-grid"><div class="detail"><span>当前状态</span><b>${row[row.length-1]}</b></div><div class="detail"><span>所属门店</span><b>FirstSun 中心店</b></div><div class="detail"><span>最近更新</span><b>今天 11:48 · HaiMing</b></div></div><div class="activity"><h3>最近活动</h3><div class="event">档案信息已同步<br><small>2 分钟前</small></div><div class="event">完成数据校验<br><small>今天 10:26</small></div></div><div class="inspector-actions"><button class="btn">查看</button><button class="btn primary">编辑</button></div>`}
function renderTable(rows){let d=data[active];head.innerHTML='<tr><th style="width:38px">□</th>'+d.cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';body.innerHTML=rows.map((r,ri)=>`<tr class="${ri===selected?'selected':''}" data-i="${ri}" style="--delay:${.03*ri}s"><td>□</td>${d.cols.map((c,ci)=>ci===d.cols.length-1?'<td><button class="row-btn">编辑 ···</button></td>':`<td>${ci===0&&active==='category'?`<div class="tree-node ${r[2]==='顶级分类'?'parent':'child'}"><span class="${r[2]==='顶级分类'?'tree-toggle':'tree-dot'}">${r[0]==='常用药品'?'⌄':r[2]==='顶级分类'?'›':''}</span><span><span class="record">${r[ci]}</span><span class="sub">${r[2]==='顶级分类'?'一级分类':'常用药品下的二级分类'}</span></span></div>`:ci===0?`<span class="record">${r[ci]}</span><span class="sub">${active==='employee'?'HM-E'+String(ri+1).padStart(3,'0'):d.en}</span>`:ci===1&&['category','barcode'].includes(active)?`<span class="mono">${r[ci]}</span>`:ci===d.cols.length-2?`<span class="tag ${tagClass(r[ci])}">${r[ci]}</span>`:r[ci]}</td>`).join('')}</tr>`).join('');body.querySelectorAll('tr').forEach(tr=>tr.onclick=e=>{if(e.target.tagName==='BUTTON')return;selected=+tr.dataset.i;renderTable(rows);renderInspector(rows[selected])})}
function animateNumber(el,val){let n=0,target=parseInt(val)||0;let timer=setInterval(()=>{n=Math.min(target,n+Math.max(1,Math.ceil(target/12)));el.textContent=n;if(n>=target)clearInterval(timer)},28)}
function render(){let d=data[active];renderNav();$('crumb').textContent=d.name;$('title').textContent=d.name;$('eyebrow').textContent=d.en;$('addBtn').textContent='＋ '+d.add;$('mainMetricLabel').textContent=d.name.replace('管理','')+'总数';animateNumber($('mainMetric'),d.total);d.metrics.forEach((m,i)=>{$('m'+(i+1)+'l').textContent=m[0];$('m'+(i+1)).innerHTML=m[1]+`<em>${m[2]}</em>`});$('keyword').placeholder='搜索'+d.name.replace('管理','')+'名称或编码';$('resultCount').textContent=`显示 ${d.rows.length} 条记录`;$('pageText').textContent=`共 ${d.total} 条 · 每页 10 条`;renderTable(d.rows);renderInspector(d.rows[0])}
function openDrawer(){let d=data[active];$('drawerTitle').textContent=d.add;$('drawerBody').innerHTML=`<div class="group"><label class="req">名称</label><input class="field" placeholder="请输入名称"></div><div class="group"><label class="req">编码</label><input class="field" placeholder="自动生成或手动输入"></div><div class="group"><label>所属分类 / 门店</label><select class="field"><option>请选择</option><option>中心店</option><option>常用药品</option></select></div><div class="group"><label class="req">状态</label><select class="field"><option>启用</option><option>停用</option></select></div><div class="group full"><label>备注</label><input class="field" placeholder="选填"></div>`;$('drawerMask').classList.add('open');$('drawer').classList.toggle('scanning',active==='barcode')}
function closeDrawer(){$('drawerMask').classList.remove('open');$('drawer').classList.remove('scanning')}
$('rail').querySelector('.rail-brand').onclick=()=>$('rail').classList.toggle('expanded');$('addBtn').onclick=openDrawer;$('closeDrawer').onclick=closeDrawer;$('cancel').onclick=closeDrawer;$('drawerMask').onclick=e=>{if(e.target===$('drawerMask'))closeDrawer()};$('save').onclick=()=>{closeDrawer();$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)};$('query').onclick=()=>{let q=$('keyword').value.toLowerCase();let rows=data[active].rows.filter(r=>r.join(' ').toLowerCase().includes(q));selected=0;renderTable(rows);renderInspector(rows[0]);$('resultCount').textContent=`显示 ${rows.length} 条记录`};render();
</script>
